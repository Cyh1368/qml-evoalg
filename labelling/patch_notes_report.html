<title>Saying It and Building It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ground:#EEF2F1; --surface:#FFFFFF; --sunk:#E4EAE9;
  --ink:#14201E; --ink2:#3C4A48; --muted:#66756F; --faint:#8B9995;
  --rule:#D3DDDA; --rule2:#E6EDEB;
  --accent:#00918A; --accent-ink:#00615C; --accent-wash:#DBEFEC;
  --clay:#A8552F; --clay-wash:#F3E3DA;
  --shadow:0 1px 2px rgba(20,32,30,.05),0 8px 24px -16px rgba(20,32,30,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1614; --surface:#161F1D; --sunk:#1C2624;
    --ink:#E6EDEB; --ink2:#C2CFCC; --muted:#93A29E; --faint:#77857F;
    --rule:#28352F; --rule2:#1F2B28;
    --accent:#28A899; --accent-ink:#5FCBBB; --accent-wash:#12302C;
    --clay:#CE7047; --clay-wash:#332016;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1614; --surface:#161F1D; --sunk:#1C2624;
  --ink:#E6EDEB; --ink2:#C2CFCC; --muted:#93A29E; --faint:#77857F;
  --rule:#28352F; --rule2:#1F2B28;
  --accent:#28A899; --accent-ink:#5FCBBB; --accent-wash:#12302C;
  --clay:#CE7047; --clay-wash:#332016;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:16.5px; line-height:1.62; margin:0;
  -webkit-font-smoothing:antialiased;
}
.page{
  display:grid; gap:0 clamp(16px,4vw,48px); padding:0 clamp(16px,5vw,56px) 96px;
  grid-template-columns:[full-start] minmax(0,1fr) [wide-start] minmax(0,64ch) [text-start] minmax(0,10ch) [text-end] minmax(0,1fr) [wide-end] minmax(0,1fr) [full-end];
}
.page>*{grid-column:wide-start/text-end}
.wide{grid-column:wide-start/wide-end}
.full{grid-column:full-start/full-end}
@media (max-width:1000px){
  .page{grid-template-columns:[full-start wide-start text-start] minmax(0,1fr) [text-end wide-end full-end]}
  .page>*,.wide,.full{grid-column:1/-1}
}

h1,h2,h3{font-family:Newsreader,Georgia,serif; font-weight:600; text-wrap:balance; margin:0}
h1{font-size:clamp(2.5rem,6.5vw,4rem); line-height:1.04; letter-spacing:-.015em}
h2{font-size:1.72rem; line-height:1.2; margin:0}
h3{font-size:1.12rem; font-family:"IBM Plex Sans",sans-serif; font-weight:600; letter-spacing:-.005em}
p{margin:0}
a{color:var(--accent-ink)}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.72rem;
  letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
}
.lede{font-size:1.2rem; line-height:1.55; color:var(--ink2)}
.small{font-size:.9rem; color:var(--muted); line-height:1.55}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
strong{font-weight:600}

header.hero{padding:clamp(56px,9vw,110px) 0 0; display:flex; flex-direction:column; gap:22px}
.hero .rule{height:2px; background:var(--ink); width:64px}
.byline{display:flex; flex-wrap:wrap; gap:10px 22px; align-items:baseline}

section{padding-top:clamp(44px,6vw,72px); display:flex; flex-direction:column; gap:18px}
.sechead{display:flex; gap:14px; align-items:baseline; border-top:1px solid var(--rule); padding-top:14px}
.secnum{font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--accent-ink); letter-spacing:.08em; padding-top:.35em}

.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:2px; background:var(--rule2); border:1px solid var(--rule); border-radius:3px; overflow:hidden}
.tile{background:var(--surface); padding:20px 20px 22px; display:flex; flex-direction:column; gap:6px}
.tile .n{font-family:Newsreader,Georgia,serif; font-size:2.5rem; line-height:1; font-variant-numeric:tabular-nums; color:var(--accent-ink)}
.tile .k{font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.tile .d{font-size:.88rem; color:var(--ink2); line-height:1.45}

.card{background:var(--surface); border:1px solid var(--rule); border-radius:3px; padding:22px clamp(16px,3vw,26px); display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow)}
.card>figcaption{font-size:.86rem; color:var(--muted); line-height:1.5}
.cardtitle{display:flex; flex-direction:column; gap:4px}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.9rem}
th,td{text-align:right; padding:8px 10px; border-bottom:1px solid var(--rule2); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{
  font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); font-weight:500;
  border-bottom:1px solid var(--rule); vertical-align:bottom;
}
tbody tr:last-child td{border-bottom:none}
td.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
tr.hl td{background:var(--accent-wash)}
.armtag{display:inline-flex; align-items:center; gap:7px}
.dot{width:8px; height:8px; border-radius:50%; flex:none}

.chart{display:flex; flex-direction:column; gap:14px}
.facet{display:flex; flex-direction:column; gap:9px}
.facetname{font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2)}
.bar-row{display:grid; grid-template-columns:minmax(96px,auto) 1fr minmax(86px,auto); gap:12px; align-items:center}
.bar-lab{font-size:.86rem; color:var(--ink2)}
.bar-val{font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}
.track{position:relative; height:22px; background:var(--sunk); border-radius:3px}
.fill{position:absolute; left:0; top:0; bottom:0; background:var(--accent); border-radius:0 4px 4px 0; min-width:2px}
.ci{position:absolute; top:50%; height:2px; background:var(--faint); transform:translateY(-50%)}
.ci::before,.ci::after{content:""; position:absolute; top:-4px; width:2px; height:10px; background:var(--faint)}
.ci::before{left:0} .ci::after{right:0}
.axis{display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--faint); padding-left:108px}
@media (max-width:640px){
  .bar-row{grid-template-columns:1fr; gap:4px}
  .bar-val{text-align:left}
  .axis{padding-left:0}
}

.strip{display:grid; grid-template-columns:minmax(96px,auto) 1fr; gap:12px; align-items:center}
.stripline{position:relative; height:30px}
.stripline .base{position:absolute; left:0; right:0; top:50%; height:1px; background:var(--rule)}
.pt{position:absolute; top:50%; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; border-radius:50%; background:var(--accent); opacity:.5; border:1.5px solid var(--surface)}
.mean{position:absolute; top:50%; width:2px; height:18px; margin-top:-9px; background:var(--ink)}

.gloss{display:flex; flex-direction:column; gap:0; border:1px solid var(--rule); border-radius:3px; overflow:hidden; background:var(--surface)}
.gitem{display:grid; grid-template-columns:minmax(150px,auto) 1fr; gap:16px; padding:14px 18px; border-bottom:1px solid var(--rule2)}
.gitem:last-child{border-bottom:none}
.gname{font-family:"IBM Plex Mono",monospace; font-size:.82rem; color:var(--accent-ink)}
.gdesc{font-size:.9rem; color:var(--ink2); line-height:1.5}
@media (max-width:640px){.gitem{grid-template-columns:1fr; gap:4px}}

.graphs{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px}
.gfig{display:flex; flex-direction:column; gap:8px; align-items:center; text-align:center}
.gfig .cap{font-size:.82rem; color:var(--muted); line-height:1.4}
.gfig .capname{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--ink2)}

.layerstack{display:flex; flex-direction:column; gap:6px}
.layer{display:grid; grid-template-columns:22px 1fr auto; gap:12px; align-items:center; padding:9px 12px; border:1px solid var(--rule); border-radius:3px; background:var(--surface); font-size:.85rem}
.layer.sym{border-color:var(--accent); background:var(--accent-wash)}
.layer .li{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--faint)}
.layer .ld{color:var(--ink2)}
.layer .lt{font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--muted); text-align:right}
.layer.sym .lt{color:var(--accent-ink)}
.exhead{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; font-size:.85rem; color:var(--muted)}

.callout{border-left:2px solid var(--clay); background:var(--clay-wash); padding:16px 20px; border-radius:0 3px 3px 0; display:flex; flex-direction:column; gap:8px}
.callout .h{font-weight:600; font-size:.95rem}
.callout p{font-size:.92rem; line-height:1.55; color:var(--ink2)}

ul.plain{margin:0; padding-left:1.15em; display:flex; flex-direction:column; gap:9px}
ul.plain li{padding-left:.15em}
code{font-family:"IBM Plex Mono",monospace; font-size:.86em; background:var(--sunk); padding:.1em .35em; border-radius:2px}
pre{background:var(--sunk); border:1px solid var(--rule); border-radius:3px; padding:14px 16px; overflow-x:auto; font-family:"IBM Plex Mono",monospace; font-size:.8rem; line-height:1.6; margin:0}
footer{padding-top:56px; border-top:1px solid var(--rule); margin-top:56px; color:var(--muted); font-size:.85rem; display:flex; flex-direction:column; gap:6px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.fill,.pt{transition:none}}

.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px}
.cm{display:grid; grid-template-columns:auto 1fr 1fr; gap:2px; background:var(--rule2); border:1px solid var(--rule); border-radius:3px; overflow:hidden}
.cm div{background:var(--surface); padding:12px 14px}
.cm .hd{font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.cm .cell{display:flex; flex-direction:column; gap:2px}

.badge.ok{background:var(--accent-wash); color:var(--accent-ink)}
.badge.no{background:var(--clay-wash); color:var(--clay)}
.tl{display:grid; grid-template-columns:minmax(120px,auto) 1fr; gap:10px 14px; align-items:center}
.tlline{position:relative; height:26px}
.tlline .base{position:absolute; left:0; right:0; top:50%; height:1px; background:var(--rule)}
.tlmark{position:absolute; top:50%; transform:translate(-50%,-50%); font-family:"IBM Plex Mono",monospace; font-size:.7rem}
</style>

  return {label:ARM[a], p:g.p, lo:g.lo, hi:g.hi, val:`${g.k}/${g.n} &nbsp;${pct(g.p)}`,
          tip:`${ARM[a]}: ${g.k} of ${g.n} runs — ${lab} (95% CI ${pct(g.lo)}–${pct(g.hi)})`};});
const progBar = key => ARMS.map(a=>{const g=D.q1[a][key];
  return {label:ARM[a], p:g.p, lo:g.lo, hi:g.hi, val:`${g.k}/${g.n} &nbsp;${pct(g.p)}`,
          tip:`${ARM[a]}: ${g.k} of ${g.n} patch notes (run-clustered 95% CI ${pct(g.lo)}–${pct(g.hi)})`};});

function confusion(a){
  const c = D.contingency[a], name = a==="all" ? "All three tiers" : ARM[a];
  return `<div class="card"><div class="cardtitle"><h3>${name}</h3>
    <p class="small">${c.n} patch notes · agreement &kappa; = ${f2(c.kappa)} · Fisher p = ${pval(c.fisher_p)}</p></div>
    <div class="cm">
      <div class="hd"></div><div class="hd">Circuit has all 28 pairs</div><div class="hd">Circuit does not</div>
      <div class="hd" style="align-self:center">Note claims it</div>
      <div class="cell good"><span class="n">${c.say_build}</span><span class="l">said and built</span></div>
      <div class="cell bad"><span class="n">${c.say_nobuild}</span><span class="l">said, did not build</span></div>
      <div class="hd" style="align-self:center">Note is silent</div>
      <div class="cell bad"><span class="n">${c.nosay_build}</span><span class="l">built without saying</span></div>
      <div class="cell"><span class="n">${c.nosay_nobuild}</span><span class="l">neither</span></div>
    </div></div>`;
}

function quotes(){
  return D.examples.map(e=>{
    const built = e.pairs===28;
    return `<div class="quote">
      <div class="qh"><span class="badge ${built?"ok":"no"}">${built?"built it":e.pairs+" of 28 pairs"}</span>
        <span>${ARM[e.arm]} · ${esc(e.run)} · generation ${e.gen} · score ${f2(e.score)}</span></div>
      <div class="qt">&ldquo;${esc(e.text)}&hellip;&rdquo;</div>
      <div class="qv">${esc(e.why)}${e.name && e.name!=="none" ? ` · patch name <code>${esc(e.name)}</code>` : ""}</div>
    </div>`;}).join("");
}

const sc = D.score_cells;
function scoreRows(){
  const cells = [["say1_build1","Claimed it and built it"],["say0_build1","Built it without claiming it"],
                 ["say1_build0","Claimed it but did not build it"],["say0_build0","Neither"]];
  const lo = -0.4, hi = 1.1, x = v => (v-lo)/(hi-lo)*100;
  return `<div class="chart">` + cells.map(([k,l])=>{
    const c = sc[k];
    return `<div class="bar-row" title="${l}: mean ${f2(c.mean)} over ${c.n} programs">
      <div class="bar-lab">${l}</div>
      <div class="track"><div class="fill" style="left:${x(Math.min(c.mean,0))}%;width:${Math.abs(x(c.mean)-x(0))}%;border-radius:3px"></div>
      ${isNaN(c.lo)?"":`<div class="ci" style="left:${x(c.lo)}%;width:${x(c.hi)-x(c.lo)}%"></div>`}</div>
      <div class="bar-val">${f2(c.mean)} &nbsp;<span style="color:var(--faint)">n=${c.n}</span></div></div>`;
  }).join("") + `<div class="axis"><span>-0.4</span><span>0.35</span><span>1.1</span></div></div>`;
}

const A = D.arms;
const q2f = D.q2.frontier, inh = D.inheritance;
const H = [];
H.push(`<header class="hero">
  <div class="eyebrow">Companion report · patch notes</div>
  <h1>Saying it and building it</h1>
  <p class="lede">Every time a language model edits the quantum circuit, it also writes a short note explaining what it is doing and why.
  This report compares those notes with what the circuits actually contain. The short version: models across all three tiers talk about
  the right symmetry, but only the frontier tier turns the talk into a circuit, and almost nothing is built by accident.</p>
  <div class="rule"></div>
  <div class="byline"><span class="small">${D.n_programs} patch notes · ${D.n_runs} evolution runs · three model tiers</span></div>
</header>`);

H.push(`<section><div class="sechead"><span class="secnum">01</span><h2>What the models were asked to do</h2></div>
<p>A search program (an evolutionary loop) asks a language model to improve a quantum circuit that classifies records.
Each record is a list of 28 yes/no facts. The fixed part of the circuit turns fact number <em>k</em> into an interaction between
one particular pair of the 8 qubits. There are exactly 28 ways to choose a pair out of 8 things, so the 28 facts are the 28 pairs,
and nothing distinguishes one qubit from another: renaming the qubits just renames the facts and the answer is unchanged.</p>
<p>The right structural prior is therefore <strong>permutation symmetry</strong>: treat all 8 qubits alike. In circuit terms
the clean way to express it is an entangler that touches <strong>all 28 qubit pairs</strong> (the complete graph on 8 vertices,
often written K<sub>8</sub>), paired with rotation layers that share one angle across all 8 wires. The companion report
&ldquo;Who Builds the Symmetry&rdquo; labelled the circuits themselves and found a plain split: frontier-tier ensembles build
this structure, weak and mid tiers essentially never do.</p>
<p>That left an open question. Is the weak/mid failure a failure of <em>seeing</em> the symmetry or a failure of <em>building</em> it?
The patch notes are the place to look, because they record what the model believed it was doing before the circuit was scored.</p>
<div class="tiles">
  <div class="tile"><div class="k">Weak tier</div><div class="n">${A.weak.programs}</div><div class="d">notes over ${A.weak.runs} runs</div></div>
  <div class="tile"><div class="k">Mid tier</div><div class="n">${A.mid.programs}</div><div class="d">notes over ${A.mid.runs} runs</div></div>
  <div class="tile"><div class="k">Frontier tier</div><div class="n">${A.frontier.programs}</div><div class="d">notes over ${A.frontier.runs} runs</div></div>
</div>
<p class="small">Only edits proposed by the run's own ensemble are counted. ${D.n_empty_notes} further programs carry an empty note and are excluded.</p></section>`);

H.push(`<section><div class="sechead"><span class="secnum">02</span><h2>How the notes were read</h2></div>
<p>The notes are free text, a paragraph or two each, so they were labelled with a pattern search rather than by hand.
Reading a few dozen notes first showed the models use a small, repetitive vocabulary, which makes patterns workable.
Two labels matter for the questions below.</p>
<div class="gloss">
  <div class="gitem"><div class="gname">Mentions the structure</div><div class="gdesc">The note refers to the all-pairs or permutation structure at all: names it (&ldquo;permutation-equivariant&rdquo;, &ldquo;invariant under qubit relabelling&rdquo;, &ldquo;S<sub>8</sub>&rdquo;), describes it (&ldquo;complete graph&rdquo;, &ldquo;all-to-all&rdquo;, &ldquo;all 28 CZ gates&rdquo;, &ldquo;K8&rdquo;), or notes that the fixed feature map already couples every pair.</div></div>
  <div class="gitem"><div class="gname">Claims to build it</div><div class="gdesc">Same vocabulary, but describing the circuit being proposed rather than the fixed feature map, and not inside a rejection (&ldquo;instead of an all-to-all layer&hellip;&rdquo; does not count).</div></div>
  <div class="gitem"><div class="gname">Collective rotations</div><div class="gdesc">A weaker ingredient: one shared angle across all 8 wires (&ldquo;collective RY&rdquo;, &ldquo;shared across all qubits&rdquo;). Necessary for the symmetry but far from sufficient.</div></div>
  <div class="gitem"><div class="gname">Smaller symmetry only</div><div class="gdesc">Mirror pairs, even/odd parity, quadrant tying. These are symmetries of the circuit, but not the symmetry of the task.</div></div>
</div>
<p>On the circuit side, a program <strong>built the symmetry</strong> when the two-qubit gates in one ansatz block touch all 28
pairs. This is deliberately more generous than the companion report's single-layer test: frontier models often split the complete
graph into two or three stages with rotation layers between them, which no single-layer test would catch.</p>
<div class="callout"><div class="h">How reliable is the pattern search?</div>
<p>40 notes were sampled and read by hand (20 that the patterns flagged, 20 that they did not) and judged independently.
The pattern labels agreed with the hand labels on 39 of 40 for &ldquo;mentions the structure&rdquo; and on 40 of 40 for
&ldquo;claims to build it&rdquo;. The sample is stratified on an earlier version of the patterns, so it is a check on precision,
not an unbiased estimate of how many mentions are missed entirely.</p></div></section>`);

H.push(`<section><div class="sechead"><span class="secnum">03</span><h2>Question one: can they see it?</h2></div>
<p>Yes, and the tiers are much closer here than the circuits suggest. Counting runs where <em>at least one</em> note mentions the
all-pairs structure, the mid tier is not distinguishable from the frontier tier
(${cmp("mid","frontier","identify").kb}/${cmp("mid","frontier","identify").nb} versus
${cmp("mid","frontier","identify").ka}/${cmp("mid","frontier","identify").na} runs, Fisher p = ${pval(cmp("mid","frontier","identify").p)}).
Even the weak tier gets there in about a third of its runs.</p>
<figure class="card"><div class="cardtitle"><h3>Runs where some note mentions the all-pairs structure</h3></div>
${bars(runBar("run_said_any","mentions the all-pairs structure"), "Bars are the fraction of runs; whiskers are 95% Wilson intervals.")}</figure>
<p>The picture changes as soon as you ask <em>how often</em> the idea comes up, and whether the note claims the circuit itself will
have it. Mentioning it once in fifty generations is not the same as working on it.</p>
<figure class="card"><div class="cardtitle"><h3>Share of individual notes</h3>
<p class="small">Left to right within each group: the idea appears at all, then the note claims its own circuit carries it.</p></div>
<div class="facet"><div class="facetname">Mentions the all-pairs structure</div>${bars(progBar("said_any"))}</div>
<div class="facet"><div class="facetname">Claims to build it</div>${bars(progBar("said_build"))}</div>
<div class="facet"><div class="facetname">Talks only about a smaller symmetry (mirror, parity, quadrants)</div>${bars(progBar("partial"))}</div>
<figcaption>Whiskers are run-clustered bootstrap 95% intervals, so a single talkative run cannot carry a tier.</figcaption></figure>
<p>Two things stand out. The frontier tier returns to the idea in ${pct(D.q1.frontier.said_any.p)} of its notes against
${pct(D.q1.mid.said_any.p)} for mid and ${pct(D.q1.weak.said_any.p)} for weak. And the mid tier spends most of its words on the
wrong symmetry: ${pct(D.q1.mid.partial.p)} of mid notes discuss mirror pairs, even/odd parity or quadrant tying, which are
symmetries of a circuit but not symmetries of this task.</p></section>`);

H.push(`<section><div class="sechead"><span class="secnum">04</span><h2>Question two: do they build what they claim?</h2></div>
<p>This is where the tiers separate. When a frontier note claims the all-pairs structure, the circuit has it
${q2f.build_given_say.k} times out of ${q2f.build_given_say.n} (${pct(q2f.build_given_say.p)}, 95% CI ${pct(q2f.build_given_say.lo)}&ndash;${pct(q2f.build_given_say.hi)}).
When weak and mid notes make the same claim, it happens once in nine attempts.</p>
<div class="grid2">${["frontier","mid","weak"].map(confusion).join("")}</div>
<p class="small">Weak and mid have too few claims for a confidence interval to mean much; the point is that the claims exist and the circuits do not follow.</p>
<figure class="card"><div class="cardtitle"><h3>What the mismatch looks like</h3></div>${quotes()}</figure>
<p>The failure is not vocabulary. Weak and mid notes use the same words &mdash; &ldquo;all-to-all entanglement&rdquo;,
&ldquo;connecting all qubit pairs&rdquo; &mdash; and then emit a ring, a hypercube or a brickwork pattern covering 11 to 16 of the
28 pairs. Writing out all 28 pairs correctly is a bookkeeping task, and that is the step the smaller models miss.</p>
<div class="callout"><div class="h">The frontier tier's misses are a different kind</div>
<p>Frontier notes claim the structure ${q2f.build_given_say.n} times and fall short ${q2f.build_given_say.n - q2f.build_given_say.k} times.
Five of those eight are deliberate: the note says it is trading the complete graph for a sparser entangler (a bipartite graph, a ring,
a circulant) to cut gate count, and the pattern search picks up the complete graph it is arguing against. The other three are genuine
overclaims &mdash; a symmetric-sounding design that delivers a 12-edge cube.</p></div></section>`);

H.push(`<section><div class="sechead"><span class="secnum">05</span><h2>Question three: could it be an accident?</h2></div>
<p>No. Of the ${inh.silent_total + inh.stated_total} programs whose circuit covers all 28 pairs,
${inh.stated_total} announce it in their note. The remaining ${inh.silent_total} are silent &mdash; and every one of them
inherited the structure from a parent program that already had it and had already described it. The silent notes are about
something else entirely (a new mixer, a change of gate type) while quietly keeping the entangler intact.</p>
<div class="tiles">
  <div class="tile"><div class="k">Built and announced</div><div class="n">${inh.stated_total}</div><div class="d">the note refers to the all-pairs structure</div></div>
  <div class="tile"><div class="k">Built in silence</div><div class="n">${inh.silent_total}</div><div class="d">no mention anywhere in the note</div></div>
  <div class="tile"><div class="k">Silent and inherited</div><div class="n">${inh.silent_parent_built}/${inh.silent_total}</div><div class="d">parent already had the structure</div></div>
  <div class="tile"><div class="k">Invented in silence</div><div class="n">0</div><div class="d">no program built it from scratch without saying so</div></div>
</div>
<p>The same conclusion comes from the timing. In every run that ever built the structure, the first note claiming it arrives in the
same generation as the first circuit that has it, or earlier &mdash; never later. Frontier runs:
${D.lead_summary.frontier.say_first} runs where the claim comes first, ${D.lead_summary.frontier.same_gen} where claim and circuit
arrive together, ${D.lead_summary.frontier.build_first} where the circuit comes first.</p>
<p>So the structure is not stumbled into. It is proposed on purpose, by a model that has said out loud what it is aiming for.</p></section>`);

H.push(`<section><div class="sechead"><span class="secnum">06</span><h2>Does saying it help, or is the circuit all that matters?</h2></div>
<p>The score here is the search program's own fitness: 0 is the starting circuit, 1 is the best circuit found for this task, and
negative is worse than the start. Programs that build the structure score far above everything else, whether or not the note
mentions it. Programs that claim it without building it are worth roughly nothing.</p>
<figure class="card"><div class="cardtitle"><h3>Mean score by what the note said and what the circuit did</h3></div>
${scoreRows()}
<figcaption>Bootstrap 95% intervals; each program counted once. Built and announced ${f2(D.score_silent_vs_stated_build.stated.mean)}
versus built in silence ${f2(D.score_silent_vs_stated_build.silent.mean)}, Mann-Whitney p = ${pval(D.score_silent_vs_stated_build.mw_p)}
&mdash; no detectable difference, as expected, since only the circuit is scored.</figcaption></figure>
<p>Talk is worth nothing on its own. It is worth a great deal as evidence of intent, because in this dataset intent and
construction go together for exactly one tier.</p></section>`);

H.push(`<section><div class="sechead"><span class="secnum">07</span><h2>What this changes</h2></div>
<ul class="plain">
<li><strong>Weak and mid are not separated by insight alone.</strong> Both tiers reach the all-pairs idea in a majority (mid) or a
third (weak) of their runs. Neither can carry it into a circuit.</li>
<li><strong>The gap is between naming a structure and constructing it.</strong> Frontier notes that claim the structure produce it
${pct(q2f.build_given_say.p)} of the time; weak and mid notes making the same claim produce it once in nine.</li>
<li><strong>Nothing here was built blind.</strong> Every from-scratch construction of the all-pairs entangler was announced in the
note that introduced it. The circuits and the stated intentions agree closely (&kappa; = ${f2(D.contingency.all.kappa)} overall).</li>
<li><strong>Mid tier's attention goes to the wrong symmetry.</strong> Over half its notes discuss mirror or parity structures,
which the task does not reward.</li>
</ul></section>`);

H.push(`<section><div class="sechead"><span class="secnum">08</span><h2>Caveats</h2></div>
<ul class="plain">
<li>The tiers differ in how many runs and generations they had: ${A.weak.runs} weak runs, ${A.mid.runs} mid, ${A.frontier.runs} frontier.
Run-level rates are the fairer comparison; program-level rates are shown with run-clustered intervals for the same reason.</li>
<li>Patch notes are self-reports written before scoring. A note can be honest about intent and still describe a circuit the model failed to write.</li>
<li>The pattern search is a proxy for reading. It was checked against 40 hand-read notes and disagreed on one, but rare phrasings will be missed.</li>
<li>&ldquo;Built the symmetry&rdquo; means the block's two-qubit gates cover all 28 pairs. A circuit can cover all 28 pairs and still not
be exactly permutation-invariant as a unitary, for instance when directed controlled rotations carry different angles.
The companion report's stricter test is available for those cases.</li>
<li>Weak and mid produced ${D.contingency.weak.say_build + D.contingency.weak.say_nobuild + D.contingency.mid.say_build + D.contingency.mid.say_nobuild}
claims between them, so their say-to-build rate is an observation, not a precise estimate.</li>
</ul>
<h3 style="margin-top:12px">Reproducing this</h3>
<pre>labelling/label_notes.py    label every patch note, join with circuit labels
labelling/note_stats.py     rates, bootstraps, contingency tables
labelling/build_notes_report.py  this page</pre></section>`);

H.push(`<footer><div>Patch-note analysis of ${D.n_programs} circuit edits across ${D.n_runs} evolution runs.</div>
<div>Companion to &ldquo;Who Builds the Symmetry&rdquo;, which labelled the circuits.</div></footer>`);

document.getElementById("page").innerHTML = H.join("");
</script>
