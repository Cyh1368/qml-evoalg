<title>Who Builds the Symmetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EEF2F1; --surface:#FFFFFF; --sunk:#E4EAE9;
  --ink:#14201E; --ink2:#3C4A48; --muted:#66756F; --faint:#8B9995;
  --rule:#D3DDDA; --rule2:#E6EDEB;
  --accent:#00918A; --accent-ink:#00615C; --accent-wash:#DBEFEC;
  --clay:#A8552F; --clay-wash:#F3E3DA;
  --shadow:0 1px 2px rgba(20,32,30,.05),0 8px 24px -16px rgba(20,32,30,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1614; --surface:#161F1D; --sunk:#1C2624;
    --ink:#E6EDEB; --ink2:#C2CFCC; --muted:#93A29E; --faint:#77857F;
    --rule:#28352F; --rule2:#1F2B28;
    --accent:#28A899; --accent-ink:#5FCBBB; --accent-wash:#12302C;
    --clay:#CE7047; --clay-wash:#332016;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1614; --surface:#161F1D; --sunk:#1C2624;
  --ink:#E6EDEB; --ink2:#C2CFCC; --muted:#93A29E; --faint:#77857F;
  --rule:#28352F; --rule2:#1F2B28;
  --accent:#28A899; --accent-ink:#5FCBBB; --accent-wash:#12302C;
  --clay:#CE7047; --clay-wash:#332016;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:16.5px; line-height:1.62; margin:0;
  -webkit-font-smoothing:antialiased;
}
.page{
  display:grid; gap:0 clamp(16px,4vw,48px); padding:0 clamp(16px,5vw,56px) 96px;
  grid-template-columns:[full-start] minmax(0,1fr) [wide-start] minmax(0,64ch) [text-start] minmax(0,10ch) [text-end] minmax(0,1fr) [wide-end] minmax(0,1fr) [full-end];
}
.page>*{grid-column:wide-start/text-end}
.wide{grid-column:wide-start/wide-end}
.full{grid-column:full-start/full-end}
@media (max-width:1000px){
  .page{grid-template-columns:[full-start wide-start text-start] minmax(0,1fr) [text-end wide-end full-end]}
  .page>*,.wide,.full{grid-column:1/-1}
}

h1,h2,h3{font-family:Newsreader,Georgia,serif; font-weight:600; text-wrap:balance; margin:0}
h1{font-size:clamp(2.5rem,6.5vw,4rem); line-height:1.04; letter-spacing:-.015em}
h2{font-size:1.72rem; line-height:1.2; margin:0}
h3{font-size:1.12rem; font-family:"IBM Plex Sans",sans-serif; font-weight:600; letter-spacing:-.005em}
p{margin:0}
a{color:var(--accent-ink)}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.72rem;
  letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
}
.lede{font-size:1.2rem; line-height:1.55; color:var(--ink2)}
.small{font-size:.9rem; color:var(--muted); line-height:1.55}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
strong{font-weight:600}

header.hero{padding:clamp(56px,9vw,110px) 0 0; display:flex; flex-direction:column; gap:22px}
.hero .rule{height:2px; background:var(--ink); width:64px}
.byline{display:flex; flex-wrap:wrap; gap:10px 22px; align-items:baseline}

section{padding-top:clamp(44px,6vw,72px); display:flex; flex-direction:column; gap:18px}
.sechead{display:flex; gap:14px; align-items:baseline; border-top:1px solid var(--rule); padding-top:14px}
.secnum{font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--accent-ink); letter-spacing:.08em; padding-top:.35em}

.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:2px; background:var(--rule2); border:1px solid var(--rule); border-radius:3px; overflow:hidden}
.tile{background:var(--surface); padding:20px 20px 22px; display:flex; flex-direction:column; gap:6px}
.tile .n{font-family:Newsreader,Georgia,serif; font-size:2.5rem; line-height:1; font-variant-numeric:tabular-nums; color:var(--accent-ink)}
.tile .k{font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.tile .d{font-size:.88rem; color:var(--ink2); line-height:1.45}

.card{background:var(--surface); border:1px solid var(--rule); border-radius:3px; padding:22px clamp(16px,3vw,26px); display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow)}
.card>figcaption{font-size:.86rem; color:var(--muted); line-height:1.5}
.cardtitle{display:flex; flex-direction:column; gap:4px}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.9rem}
th,td{text-align:right; padding:8px 10px; border-bottom:1px solid var(--rule2); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{
  font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); font-weight:500;
  border-bottom:1px solid var(--rule); vertical-align:bottom;
}
tbody tr:last-child td{border-bottom:none}
td.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
tr.hl td{background:var(--accent-wash)}
.armtag{display:inline-flex; align-items:center; gap:7px}
.dot{width:8px; height:8px; border-radius:50%; flex:none}

.chart{display:flex; flex-direction:column; gap:14px}
.facet{display:flex; flex-direction:column; gap:9px}
.facetname{font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2)}
.bar-row{display:grid; grid-template-columns:minmax(96px,auto) 1fr minmax(86px,auto); gap:12px; align-items:center}
.bar-lab{font-size:.86rem; color:var(--ink2)}
.bar-val{font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}
.track{position:relative; height:22px; background:var(--sunk); border-radius:3px}
.fill{position:absolute; left:0; top:0; bottom:0; background:var(--accent); border-radius:0 4px 4px 0; min-width:2px}
.ci{position:absolute; top:50%; height:2px; background:var(--faint); transform:translateY(-50%)}
.ci::before,.ci::after{content:""; position:absolute; top:-4px; width:2px; height:10px; background:var(--faint)}
.ci::before{left:0} .ci::after{right:0}
.axis{display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--faint); padding-left:108px}
@media (max-width:640px){
  .bar-row{grid-template-columns:1fr; gap:4px}
  .bar-val{text-align:left}
  .axis{padding-left:0}
}

.strip{display:grid; grid-template-columns:minmax(96px,auto) 1fr; gap:12px; align-items:center}
.stripline{position:relative; height:30px}
.stripline .base{position:absolute; left:0; right:0; top:50%; height:1px; background:var(--rule)}
.pt{position:absolute; top:50%; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; border-radius:50%; background:var(--accent); opacity:.5; border:1.5px solid var(--surface)}
.mean{position:absolute; top:50%; width:2px; height:18px; margin-top:-9px; background:var(--ink)}

.gloss{display:flex; flex-direction:column; gap:0; border:1px solid var(--rule); border-radius:3px; overflow:hidden; background:var(--surface)}
.gitem{display:grid; grid-template-columns:minmax(150px,auto) 1fr; gap:16px; padding:14px 18px; border-bottom:1px solid var(--rule2)}
.gitem:last-child{border-bottom:none}
.gname{font-family:"IBM Plex Mono",monospace; font-size:.82rem; color:var(--accent-ink)}
.gdesc{font-size:.9rem; color:var(--ink2); line-height:1.5}
@media (max-width:640px){.gitem{grid-template-columns:1fr; gap:4px}}

.graphs{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px}
.gfig{display:flex; flex-direction:column; gap:8px; align-items:center; text-align:center}
.gfig .cap{font-size:.82rem; color:var(--muted); line-height:1.4}
.gfig .capname{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--ink2)}

.layerstack{display:flex; flex-direction:column; gap:6px}
.layer{display:grid; grid-template-columns:22px 1fr auto; gap:12px; align-items:center; padding:9px 12px; border:1px solid var(--rule); border-radius:3px; background:var(--surface); font-size:.85rem}
.layer.sym{border-color:var(--accent); background:var(--accent-wash)}
.layer .li{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--faint)}
.layer .ld{color:var(--ink2)}
.layer .lt{font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--muted); text-align:right}
.layer.sym .lt{color:var(--accent-ink)}
.exhead{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; font-size:.85rem; color:var(--muted)}

.callout{border-left:2px solid var(--clay); background:var(--clay-wash); padding:16px 20px; border-radius:0 3px 3px 0; display:flex; flex-direction:column; gap:8px}
.callout .h{font-weight:600; font-size:.95rem}
.callout p{font-size:.92rem; line-height:1.55; color:var(--ink2)}

ul.plain{margin:0; padding-left:1.15em; display:flex; flex-direction:column; gap:9px}
ul.plain li{padding-left:.15em}
code{font-family:"IBM Plex Mono",monospace; font-size:.86em; background:var(--sunk); padding:.1em .35em; border-radius:2px}
pre{background:var(--sunk); border:1px solid var(--rule); border-radius:3px; padding:14px 16px; overflow-x:auto; font-family:"IBM Plex Mono",monospace; font-size:.8rem; line-height:1.6; margin:0}
footer{padding-top:56px; border-top:1px solid var(--rule); margin-top:56px; color:var(--muted); font-size:.85rem; display:flex; flex-direction:column; gap:6px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.fill,.pt{transition:none}}
</style>

function barChart(rowsBySetting, key, note){
  let h = '<div class="chart">';
  for (const [setting, arms] of rowsBySetting){
    h += `<div class="facet"><div class="facetname">${SETNAME[setting]}</div>`;
    for (const arm of arms){
      const G = g(setting, arm), L = G.labels[key];
      const tip = `${ARMNAME[arm]}, ${SETNAME[setting].toLowerCase()}: ${L.run_k} of ${L.run_n} runs (95% CI ${pct(L.run_lo)}–${pct(L.run_hi)})`;
      h += `<div class="bar-row" title="${esc(tip)}">
        <div class="bar-lab">${ARMNAME[arm]}</div>
        <div class="track">
          <div class="fill" style="width:${Math.max(L.run_p*100,0.8)}%"></div>
          <div class="ci" style="left:${L.run_lo*100}%;width:${Math.max((L.run_hi-L.run_lo)*100,0.5)}%"></div>
        </div>
        <div class="bar-val">${L.run_k}/${L.run_n} &nbsp;${pct(L.run_p)}</div>
      </div>`;
    }
    h += '</div>';
  }
  h += '<div class="axis"><span>0%</span><span>50%</span><span>100%</span></div>';
  if (note) h += `<p class="small">${note}</p>`;
  return h + '</div>';
}

function stripChart(){
  let h = '<div class="chart">';
  for (const [setting, arms] of [["scratch",["weak","mid","frontier"]],
                                 ["continue",["weak","mid","frontier","frontier-no-gpt"]]]){
    h += `<div class="facet"><div class="facetname">${SETNAME[setting]}</div>`;
    for (const arm of arms){
      const c = D.pair_coverage.find(x => x.setting===setting && x.arm===arm);
      let pts = c.values.map(v =>
        `<div class="pt" style="left:${v*100}%" title="one run: ${Math.round(v*28)} of 28 pairs"></div>`).join("");
      h += `<div class="strip" title="${esc(ARMNAME[arm])}: mean ${f2(c.mean)} of the 28 pairs, 95% CI ${f2(c.lo)}–${f2(c.hi)}">
        <div class="bar-lab">${ARMNAME[arm]}</div>
        <div class="stripline"><div class="base"></div>${pts}
          <div class="mean" style="left:${c.mean*100}%"></div></div>
      </div>`;
    }
    h += '</div>';
  }
  h += '<div class="axis"><span>0 of 28 pairs</span><span>14</span><span>all 28</span></div>';
  return h + '</div>';
}

function graphSVG(edges, hi){
  const R=52, cx=64, cy=64, N=8;
  const pos = i => [cx + R*Math.cos(-Math.PI/2 + 2*Math.PI*i/N), cy + R*Math.sin(-Math.PI/2 + 2*Math.PI*i/N)];
  let s = `<svg viewBox="0 0 128 128" width="150" height="150" role="img" aria-label="8 qubits with ${edges.length} connections">`;
  for (const [a,b] of edges){
    const [x1,y1]=pos(a), [x2,y2]=pos(b);
    s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
      stroke="${hi?'var(--accent)':'var(--faint)'}" stroke-width="1.1" stroke-opacity="${hi?0.75:0.85}"/>`;
  }
  for (let i=0;i<N;i++){
    const [x,y]=pos(i);
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/>`;
  }
  return s + '</svg>';
}

function exampleBlock(e){
  let h = `<div class="exhead"><span class="mono">${esc(e.run)}</span><span>generation ${e.gen}</span>
    <span>proposed by <span class="mono">${esc(e.model||"—")}</span></span>
    <span>score <span class="mono">${f3(e.score)}</span></span></div><div class="layerstack">`;
  e.layers.forEach((l,i) => {
    const sym = l.labels.some(x => x==="all-double-exact" || x==="all-singular-tied");
    const what = l.n2
      ? `${l.n2} × ${l.gates.join("/")} over ${l.pairs} qubit pair${l.pairs===1?"":"s"}${l.params?`, ${l.params} angle${l.params===1?"":"s"}`:""}`
      : `${l.n1} × ${l.gates.join("/")} over ${l.wires} qubits, ${l.params} angle${l.params===1?"":"s"}`;
    h += `<div class="layer${sym?" sym":""}"><div class="li">${i+1}</div><div class="ld">${what}</div>
      <div class="lt">${l.labels.join(" · ")}</div></div>`;
  });
  return h + '</div>';
}

<section>
 <div class="sechead"><div class="secnum">01</div><h2>The task, in plain terms</h2></div>
 <p>A quantum circuit here is a recipe: a list of small operations ("gates") applied to 8 wires
 called qubits. Each gate acts on one qubit or on a pair of qubits, and many gates carry an
 adjustable dial called an angle. Training the circuit means turning those dials until the circuit
 sorts its inputs correctly.</p>
 <p>The inputs describe a network of 8 points and which points are joined. The question the circuit
 must answer is a property of that network. The important fact is that <strong>the 8 points have no
 individual identity</strong>: renaming point 3 to point 6 everywhere changes nothing about the
 answer. A circuit that treats all 8 qubits identically, and all 28 possible qubit pairs
 identically, is therefore built on the right principle. A circuit that singles out particular
 qubits is fighting the problem.</p>
 <p>Every search run was given the same weak starting circuit, which connects qubits only in a
 line: 0 to 1, 1 to 2, and so on. Getting from that line to the full set of 28 pairs is the
 discovery being measured.</p>

   <div class="gfig">${graphSVG([].concat(...Array.from({length:8},(_,i)=>Array.from({length:7-i},(_,k)=>[i,i+1+k]))), true)}

<section>
 <div class="sechead"><div class="secnum">02</div><h2>Cutting a circuit into layers</h2></div>
 <p>A circuit is stored as one long ordered list of gates, sometimes hundreds of them. Looking at
 that list as a whole is misleading: a circuit may contain one block of two-qubit gates that joins
 every pair and a second, later block that joins only a few, and pooling them together makes both
 blocks look like noise. So each circuit was first cut into <strong>layers</strong>, and each layer
 was labelled on its own.</p>
 <p>The cut follows what the circuit's author actually wrote. Every gate is described by its type
 (RX, RY, RZ, CZ, CNOT, CRX, CRY, CRZ) and, if it has an angle, by the name given to that angle.
 Angle names almost always come in numbered families, such as <code>ry_0</code> through
 <code>ry_7</code>. Two neighbouring gates belong to the same layer when they share a gate type and
 an angle-name family, with the numbers stripped off. A layer is then a maximal run of neighbouring
 gates that agree in this sense.</p>
 <p>One extra pass handles circuits written qubit-by-qubit rather than layer-by-layer, where the
 order goes RY, RZ, RY, RZ and so on. Whenever at least four one- or two-gate runs in a row draw on
 at most three distinct types, they are merged back into a single layer. Across all
 ${C.n_parsed.toLocaleString()} readable circuits this produced ${LS.n_layers_total.toLocaleString()}
 layers, a median of ${LS.median_layers} per circuit.</p>
 <div class="card">
  <div class="cardtitle"><h3>What the layers look like</h3>

   produced. Highlighted layers are the symmetric ones.</p></div>

 the analysis, when it became clear that many layers were neither fully symmetric nor shapeless.
 They turned out to be poor discriminators: a plain chain is mirror-symmetric by accident, so
 mirror appears in ${pct(D.score_by_label["mirror"].n_with / (D.score_by_label["mirror"].n_with + D.score_by_label["mirror"].n_without))}
 of all circuits and separates nothing. They are reported for completeness in section 07.</p>
</section>

<section>
 <div class="sechead"><div class="secnum">04</div><h2>What went into the count</h2></div>
 <p>Two families of run were analysed. In the <strong>from scratch</strong> family, each ensemble
 started at the line-shaped circuit and searched on its own. In the <strong>continued</strong>
 family, every run was handed the same frontier-produced circuit from generation 3 and asked to
 carry on; the point was to see whether weaker models can build on a strong start.</p>
 <p>In the continued runs, generations 0 to 3 are inherited frontier work and are
 <strong>excluded</strong> from every count on this page. Only circuits a run's own ensemble
 proposed are counted, identified by the model recorded against each circuit. Without this exclusion
 the weaker ensembles would be credited with circuits they did not write.</p>
 <div class="tablewrap card">
  <table>
   <thead><tr><th>Setting</th><th>Ensemble</th><th>Runs</th><th>Circuits counted</th><th>Generations per run</th><th>Mean best score</th></tr></thead>
   <tbody>
   ${D.groups.map(G => `<tr><td>${SETNAME[G.setting]}</td><td>${ARMNAME[G.arm]}</td>
     <td class="num">${G.n_runs}</td><td class="num">${G.n_programs}</td>
     <td class="num">${G.gens_per_run.join(", ")}</td>
     <td class="num">${f2(G.best_score.mean)} <span style="color:var(--faint)">[${f2(G.best_score.lo)}, ${f2(G.best_score.hi)}]</span></td></tr>`).join("")}
   </tbody>
  </table>
  <figcaption>Score is the search's own combined score: 0 is the starting circuit, 1 is the best
  circuit found anywhere on this task, and negative means worse than the start. Brackets are 95%
  bootstrap intervals over runs. ${C.n_unparsed} of ${C.n_programs_total} stored circuits could not
  be read back (broken source in the record) and are dropped.</figcaption>
 </div>
</section>

<section>
 <div class="sechead"><div class="secnum">05</div><h2>Who actually built the symmetry</h2></div>
 <p>The headline measure is whether a run ever produced a circuit containing an
 <strong>exactly symmetric</strong> layer: the same gate on all 28 qubit pairs, in a form that
 genuinely does not care which qubit is which. The unit is the run, not the circuit, because
 circuits within a run are descendants of one another and are not independent.</p>
 <div class="card">
  <div class="cardtitle"><h3>Runs that built an exactly symmetric layer</h3>
   <p class="small">Bars are the share of runs; whiskers are 95% Wilson intervals.</p></div>
  ${barChart([["scratch",["weak","mid","frontier"]],["continue",["weak","mid","frontier","frontier-no-gpt"]]], "all-double-exact")}
  <figcaption>Frontier ensembles built it in every from-scratch run and in ${cf.labels["all-double-exact"].run_k}
  of ${cf.labels["all-double-exact"].run_n} continued runs. No weak or mid run built one, in either
  setting. The gap is significant despite the small samples: Fisher's exact test on mid against
  frontier gives p = ${pval(fisherS.p)} from scratch and p = ${pval(fisherC.p)} continued.</figcaption>
 </div>
 <p>The looser <strong>all-double</strong> label, which only asks that all 28 pairs be touched
 without requiring the result to be symmetric, adds exactly one weak run to the tally. That run's
 circuit put a differently-named angle on every pair and scored
 ${f2(D.within_arm_all_double.find(x=>x.setting==="scratch"&&x.arm==="weak").with.mean)}, well below
 the starting circuit. Touching every pair without tying the angles together does not help.</p>
 <div class="callout">
  <div class="h">The continued runs are short</div>
  <p>Each continued run contributed only about four of its own circuits before stopping, so a weak
  ensemble had few chances to build anything. The zero results there are consistent with "cannot",
  but they are also consistent with "not enough attempts". The from-scratch runs, where weak
  ensembles produced ${g("scratch","weak").n_programs} circuits across ${g("scratch","weak").n_runs}
  runs without one exact layer, carry the stronger evidence.</p>
 </div>
</section>

<section>
 <div class="sechead"><div class="secnum">06</div><h2>Partial credit</h2></div>
 <p>A pass-or-fail label hides how close a run came. For each run, the chart below takes its most
 connected single layer and asks how many of the 28 pairs that layer joins.</p>
 <div class="card">
  <div class="cardtitle"><h3>Best single layer per run, as a share of the 28 pairs</h3>
   <p class="small">One dot per run; the vertical line is the group mean.</p></div>
  ${stripChart()}
  <figcaption>Weak and mid runs cluster near 8 to 12 pairs of 28: chains, rings, and hand-picked
  patterns like joining qubits that differ in one binary digit. They are not close to the full set
  and stop at structures a person would draw by hand. Frontier from-scratch runs reach all 28 pairs
  in every run.</figcaption>
 </div>
</section>

<section>
 <div class="sechead"><div class="secnum">07</div><h2>Does the symmetry pay off?</h2></div>
 <p>Circuits with an exactly symmetric layer score far higher: mean ${f2(exactAll.mean)}
 (95% CI ${f2(exactAll.lo)} to ${f2(exactAll.hi)}, n = ${exactAll.n_with}) against
 ${f2(exactAll.mean_without)} for the ${exactAll.n_without.toLocaleString()} circuits without one.
 The rank difference is large and significant (Mann–Whitney p ${pval(exactAll.mw_p)},
 Cliff's delta ${f2(exactAll.cliffs_delta)}).</p>
 <div class="callout">
  <div class="h">Read that comparison carefully</div>
  <p>Nearly every symmetric circuit was written by a frontier ensemble, and frontier ensembles score
  higher regardless. Pooled across ensembles, the comparison cannot separate "the symmetry helps"
  from "strong models write good circuits". The test that can is a comparison inside a single
  ensemble.</p>
 </div>
 <p>Within the frontier from-scratch runs alone, circuits containing the symmetric layer score
 ${f2(wFront.with.mean)} (95% CI ${f2(wFront.with.lo)} to ${f2(wFront.with.hi)}, n = ${wFront.n_with})
 against ${f2(wFront.without.mean)} for the ${wFront.n_without} frontier circuits without it,
 Mann–Whitney p = ${pval(wFront.mw_p)}. The continued frontier runs give the same direction:
 ${f2(wCont.with.mean)} against ${f2(wCont.without.mean)}, p = ${pval(wCont.mw_p)}. Same models, same
 task, same budget: the circuits carrying the symmetry are the ones that score.</p>
 <div class="tablewrap card">
  <div class="cardtitle"><h3>Every label, across all counted circuits</h3></div>
  <table>
   <thead><tr><th>Label</th><th>Circuits</th><th>Share</th><th>Mean score with</th><th>Mean score without</th><th>Mann–Whitney p</th></tr></thead>
   <tbody>
   ${["all-double-exact","all-double","all-double-tied","all-singular-tied","all-singular","ring","linear-chain","mirror","cyclic","none"].map(k => {
     const v = D.score_by_label[k]; const n = v.n_with + v.n_without;
     return `<tr class="${k==="all-double-exact"?"hl":""}"><td class="mono">${k}</td>
      <td class="num">${v.n_with}</td><td class="num">${pct(v.n_with/n)}</td>
      <td class="num">${f2(v.mean)} <span style="color:var(--faint)">${isNaN(v.lo)?"":`[${f2(v.lo)}, ${f2(v.hi)}]`}</span></td>
      <td class="num">${f2(v.mean_without)}</td>
      <td class="num">${v.mw_p===undefined?"—":pval(v.mw_p)}</td></tr>`;
   }).join("")}
   </tbody>
  </table>
  <figcaption>Shares are of the ${C.n_own} circuits proposed by a counted ensemble. Note that
  <span class="mono">ring</span> and <span class="mono">linear-chain</span> carry
  <em>below-average</em> scores: they are the shapes runs settle into when they do not find the
  symmetry. Brackets are 95% bootstrap intervals on the mean.</figcaption>
 </div>
</section>

<section>
 <div class="sechead"><div class="secnum">08</div><h2>What this does not show</h2></div>
 <ul class="plain">
  <li><strong>Few frontier runs.</strong> Three from-scratch and five continued frontier runs.
  "Every run" means three runs. The intervals in section 05 are wide on purpose.</li>
  <li><strong>The frontier-no-GPT arm is nearly empty.</strong> Four runs contributing eight
  circuits in total. Its zero is compatible with almost anything; the comparison against the full
  frontier arm gives p = ${pval(D.comparisons.find(c=>c.setting==="continue"&&c.label==="all-double"&&c.b==="frontier-no-gpt"&&c.a==="frontier").p)}
  and settles nothing.</li>
  <li><strong>Budget is not held fixed.</strong> From-scratch runs used either 20 or 50 generations
  and continued runs about 4. Restricting the from-scratch runs to their first 20 generations does
  not change the picture: ${D.budget_matched_scratch.map(m => `${ARMNAME[m.arm].toLowerCase()} ${m.k}/${m.n}`).join(", ")}
  runs reach an all-pairs layer.</li>
  <li><strong>The labels are structural, not behavioural.</strong> A layer is called symmetric
  because of how it is written, not because the trained circuit was tested for symmetric behaviour.
  A circuit could in principle be written asymmetrically and still learn a symmetric function.</li>
  <li><strong>Scores are noisy.</strong> Repeated identical runs on this task are known to span a
  wide range of scores, so single-run scores should not be read closely. Every number here is a
  group statistic with an interval attached.</li>
  <li><strong>Ensembles differ in two ways at once.</strong> The weak, mid, and frontier arms differ
  in model strength <em>and</em> in how much reasoning effort each model was given. This report
  cannot separate those.</li>
 </ul>
</section>

<section>
 <div class="sechead"><div class="secnum">09</div><h2>How the numbers were produced</h2></div>
 <p>Circuits were read from the stored search databases. Where the recorded source built its gate
 list with a loop rather than writing it out, the block was executed to recover the list. Layer
 cutting, labelling, and every statistic are in two scripts, run in order:</p>
 <pre>labelling/label_circuits.py   # circuits -> layers -> labels  (labelling/labels.json)
labelling/stats.py            # labels -> group statistics    (labelling/stats.json)</pre>
 <p class="small">Proportions use Wilson 95% intervals. Means use 20,000-sample bootstrap
 percentile intervals, resampling runs rather than circuits wherever a rate is pooled across a
 group, so that circuits within a run are not treated as independent. Group comparisons on rates use
 Fisher's exact test; comparisons on scores use the two-sided Mann–Whitney U test with Cliff's delta
 as the effect size. No correction for multiple comparisons is applied, so the borderline p-values
 in the full label table should be treated as descriptive.</p>
</section>
